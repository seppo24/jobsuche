<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Karriere</title></head><body><header><nav><a href="/">Start</a> <a href="/karriere">Karriere</a></nav></header><h1>Karriere</h1><style>.row{height:80px}</style><p>60 offene Stellen</p><div id="list"></div><script>const T=['Projektleiter','Teamleiter','Konstrukteur','Servicetechniker','Projektmanager','Einkäufer','Entwicklungsingenieur','Vertriebsingenieur'];const title=i=>T[i%T.length]+' Bereich '+i+' (m/w/d)';let n=0,busy=false;function add(){for(let i=n;i<n+20&&i<60;i++){const d=document.createElement('div');d.className='row';d.innerHTML='<a href="/p/'+i+'"><span>'+title(i)+'</span><span>Hagen</span></a>';document.getElementById('list').appendChild(d)}n+=20;busy=false}
add();window.addEventListener('scroll',()=>{if(!busy&&n<60&&innerHeight+scrollY>=document.body.scrollHeight-50){busy=true;setTimeout(add,300)}})</script><footer><a href="/datenschutz">Datenschutz</a></footer></body></html>

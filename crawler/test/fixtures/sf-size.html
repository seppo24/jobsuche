<!doctype html><html lang="de"><head><meta charset="utf-8"><title>K</title></head><body><header><nav><a href="/">Start</a></nav></header><main><h1>Career</h1><p><b>40 Jobs</b> match the selections</p><table><tbody id="t"></tbody></table>
<label>Items per page <select id="sz"><option>10</option><option>25</option><option>50</option></select></label>
<script>const T=['Projektleiter', 'Teamleiter Montage', 'Konstrukteur', 'Servicetechniker', 'Projektmanager Anlagenbau', 'Einkäufer', 'Elektroniker', 'Bauleiter'];function rows(a,b){return Array.from({length:b-a},(_, i)=>{const n=a+i;return '<tr class="data-row"><td><span class="jobTitle"><a class="jobTitle-link" href="/job/'+n+'/">'+T[n%8]+' Nr. '+n+' (m/w/d)</a></span><br><span class="jobLocation">Wuppertal, DE</span></td></tr>'}).join('')}
const t=document.getElementById('t'),sz=document.getElementById('sz');function d(){t.innerHTML=rows(0,Math.min(40,+sz.value))}d();sz.onchange=d;</script></main><footer><a href="/impressum">Impressum</a></footer></body></html>

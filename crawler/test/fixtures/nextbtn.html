<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Karriere</title></head><body><header><nav><a href="/">Start</a> <a href="/karriere">Karriere</a></nav></header><h1>Karriere</h1><p>40 Stellen</p><div id="list"></div><nav class="pagination"><button id="prev">Zurück</button><button id="nx">Weiter</button></nav><script>const T=['Projektleiter','Teamleiter','Konstrukteur','Servicetechniker','Projektmanager','Einkäufer','Entwicklungsingenieur','Vertriebsingenieur'];const title=i=>T[i%T.length]+' Bereich '+i+' (m/w/d)';let pg=0;function show(){const l=document.getElementById('list');l.innerHTML='';for(let i=pg*10;i<pg*10+10;i++){const d=document.createElement('div');d.className='row';d.innerHTML='<a href="/p/'+i+'"><span>'+title(i)+'</span><span>Schwelm</span></a>';l.appendChild(d)}if(pg>=3)document.getElementById('nx').remove()}
show();document.getElementById('nx').addEventListener('click',()=>{pg++;setTimeout(show,200)})</script><footer><a href="/datenschutz">Datenschutz</a></footer></body></html>

<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Karriere</title></head><body><header><nav><a href="/">Start</a> <a href="/karriere">Karriere</a></nav></header><h1>Karriere</h1><p>90 Stellen gefunden</p><div id="list"></div><a href="#" id="m" class="btn">Weitere Jobs anzeigen</a><script>const T=['Projektleiter','Teamleiter','Konstrukteur','Servicetechniker','Projektmanager','Einkäufer','Entwicklungsingenieur','Vertriebsingenieur'];const title=i=>T[i%T.length]+' Bereich '+i+' (m/w/d)';let n=0;function add(){for(let i=n;i<n+30&&i<90;i++){const d=document.createElement('div');d.className='row';d.innerHTML='<a href="/p/'+i+'"><span>'+title(i)+'</span><span>Wuppertal</span></a>';document.getElementById('list').appendChild(d)}n+=30;if(n>=90)document.getElementById('m').remove()}
add();document.getElementById('m').addEventListener('click',e=>{e.preventDefault();setTimeout(add,300)})</script><footer><a href="/datenschutz">Datenschutz</a></footer></body></html>
